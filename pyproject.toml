[project]
name = "motif-3-mixed-ds4"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "huggingface-hub>=1.27.0",
  "requests>=2.31",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
test = ["numpy>=2.0", "pytest>=8.0"]
reference = [
  "numpy>=2.0",
  "safetensors>=0.5",
  "torch>=2.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
